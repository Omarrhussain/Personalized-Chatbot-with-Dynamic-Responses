<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">✨</div>
            <span>Personal AI</span>
        </div>
        <button id="newChatBtn" class="new-chat-btn">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="20" width="20">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New chat
        </button>
        <div class="history-list">
            <div class="history-item active">Current Conversation</div>
        </div>
        <div class="sidebar-footer">
            <div class="status-indicator">
                <span class="dot"></span> Online
            </div>
        </div>
    </div>

    <div class="main-content">
        <header class="topbar">
            <h2>Personal AI Assistant</h2>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-container">
                <div class="sparkle-icon">✨</div>
                <h1>Hello, I'm your AI</h1>
                <p>Powered by Advanced RAG & Multi-Agent Systems. How can I help you today?</p>
            </div>
        </div>

        <div class="input-container">
            <form id="chatForm" class="chat-form">
                <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off">
                <button type="submit" id="sendBtn" class="send-btn">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="20" width="20">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="disclaimer">AI can make mistakes. Verify important information.</div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
